version: '3.8'
services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: codecase
      MYSQL_USER: codecase
      MYSQL_PASSWORD: codecase
      MYSQL_ROOT_PASSWORD: codecase
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://codecase:codecase@db:3306/codecase
    depends_on:
      - db
      - redis
  worker:
    build: ./backend
    command: celery -A app.celery_app.celery worker --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: "dev-secret"
    depends_on:
      - redis
      - db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db_data:
