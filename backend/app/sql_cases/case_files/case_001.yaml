slug: "case-001-the-missing-funds"
title: "Case #001 — The Missing Funds"
chapter: 1
difficulty: "easy"
story_intro: |
  A prestigious auction house, Hartwell & Sons, has reported that £47,000
  disappeared from a charity gala held on the 14th of June.
  Three suspects were present that evening: two art dealers and a
  private collector. The transactions database was recovered from a
  damaged server — your job is to query it and find the culprit.

  You have access to two tables:
    * suspects  — everyone who attended the gala
    * transactions — every payment processed that night
  Good luck, Detective.
intro_dialogue: |
  Commissioner Blake leans back and slides a manila folder across the desk.
  "First case, Detective. Simple brief: £47,000 vanished from the Hartwell gala last Tuesday.
  Three suspects, one night, one server's worth of data. Dr. Chen from forensics will walk you through the database."
epilogue_text: |
  Case closed. Marcus Hale attempted to launder £47,000 through the auction house's own
  transaction system — bold, but ultimately traceable. As Commissioner Blake slaps the file
  shut, his phone rings. "We've got another one, Detective. Three years old, went cold.
  But someone's been moving pieces on a chess board we can't see. Get ready."

npc_characters:
  - id: "blake"
    name: "Commissioner Blake"
    avatar: "👮"
    title: "Metropolitan Police Commissioner"
  - id: "maya"
    name: "Dr. Maya Chen"
    avatar: "👩‍🔬"
    title: "Tech Forensics Expert"
  - id: "riya"
    name: "Riya Sharma"
    avatar: "👩‍💼"
    title: "Junior Detective"

stages:
  - slug: "who-was-there"
    order: 1
    title: "Who Was There?"
    prompt: |
      Let's start with the basics. List the full name and role of every
      person who attended the gala (attended = 1).
      Order the results by name ascending.
    schema_description: |
      Table: suspects
        id        INTEGER  PRIMARY KEY
        name      TEXT     Full name of the individual
        role      TEXT     Their occupation (e.g. "Art Dealer", "Collector")
        attended  INTEGER  1 if they attended the gala, 0 otherwise
    schema_sql: |
      CREATE TABLE suspects (
        id       INTEGER PRIMARY KEY,
        name     TEXT NOT NULL,
        role     TEXT NOT NULL,
        attended INTEGER NOT NULL DEFAULT 0
      );
      CREATE TABLE transactions (
        id           INTEGER PRIMARY KEY,
        suspect_id   INTEGER REFERENCES suspects(id),
        amount       REAL NOT NULL,
        description  TEXT,
        txn_time     TEXT
      );
    seed_sql: |
      INSERT INTO suspects VALUES
        (1, 'Eleanor Voss',   'Art Dealer',  1),
        (2, 'Marcus Hale',    'Collector',   1),
        (3, 'Fiona Draper',   'Art Dealer',  1),
        (4, 'Gregory Nunn',   'Auctioneer',  0);
      INSERT INTO transactions VALUES
        (1,  1,  5200.00, 'Lot 12 purchase',      '2024-06-14 19:45:00'),
        (2,  2, 47000.00, 'Wire transfer out',     '2024-06-14 22:10:00'),
        (3,  3,  1800.00, 'Lot 7 purchase',        '2024-06-14 20:30:00'),
        (4,  2,   350.00, 'Catalogue subscription','2024-06-14 18:00:00'),
        (5,  1,  2100.00, 'Lot 5 purchase',        '2024-06-14 21:00:00');
    expected_result:
      - name: "Eleanor Voss"
        role: "Art Dealer"
      - name: "Fiona Draper"
        role: "Art Dealer"
      - name: "Marcus Hale"
        role: "Collector"
    order_sensitive: true
    xp_reward: 5
    hints:
      - text: "Start with the suspects table and decide which rows represent people who were present."
        cost_points: 0
      - text: "The attendance flag is numeric; keep rows whose attended value is 1, then choose name and role."
        cost_points: 2
      - text: "Your final shape needs the name and role columns, filtered by attended = 1 and sorted by name ascending."
        cost_points: 5
    npc_hints:
      - character: "blake"
        dialogue: "Simple first task. Pull up every person who was actually at the gala. The suspects table marks attendance for you."
        xp_cost: 0
      - character: "maya"
        dialogue: "The attended field is an INTEGER flag. Treat 1 as present, project only the requested identity fields, and leave sorting until the end."
        xp_cost: 2
      - character: "riya"
        dialogue: "Think in three moves: choose the two requested columns, keep the present suspects, then sort their names A to Z."
        xp_cost: 5

  - slug: "follow-the-money"
    order: 2
    title: "Follow the Money"
    prompt: |
      Something suspicious stands out in the transactions. Find every
      transaction where the amount exceeded 10000. Return the suspect name,
      the amount, and the description. Order by amount descending.
    schema_description: |
      Table: suspects
        id        INTEGER  PRIMARY KEY
        name      TEXT     Full name
        role      TEXT     Occupation
        attended  INTEGER  Attendance flag
      Table: transactions
        id           INTEGER  PRIMARY KEY
        suspect_id   INTEGER  FK to suspects.id
        amount       REAL     Amount in GBP
        description  TEXT     What the transaction was for
        txn_time     TEXT     ISO-8601 timestamp
    schema_sql: |
      CREATE TABLE suspects (
        id       INTEGER PRIMARY KEY,
        name     TEXT NOT NULL,
        role     TEXT NOT NULL,
        attended INTEGER NOT NULL DEFAULT 0
      );
      CREATE TABLE transactions (
        id           INTEGER PRIMARY KEY,
        suspect_id   INTEGER REFERENCES suspects(id),
        amount       REAL NOT NULL,
        description  TEXT,
        txn_time     TEXT
      );
    seed_sql: |
      INSERT INTO suspects VALUES
        (1, 'Eleanor Voss',   'Art Dealer',  1),
        (2, 'Marcus Hale',    'Collector',   1),
        (3, 'Fiona Draper',   'Art Dealer',  1),
        (4, 'Gregory Nunn',   'Auctioneer',  0);
      INSERT INTO transactions VALUES
        (1,  1,  5200.00, 'Lot 12 purchase',      '2024-06-14 19:45:00'),
        (2,  2, 47000.00, 'Wire transfer out',     '2024-06-14 22:10:00'),
        (3,  3,  1800.00, 'Lot 7 purchase',        '2024-06-14 20:30:00'),
        (4,  2,   350.00, 'Catalogue subscription','2024-06-14 18:00:00'),
        (5,  1,  2100.00, 'Lot 5 purchase',        '2024-06-14 21:00:00');
    expected_result:
      - name: "Marcus Hale"
        amount: 47000.0
        description: "Wire transfer out"
    order_sensitive: false
    xp_reward: 10
    hints:
      - text: "The amount and description live in transactions, while the suspect's name lives in suspects."
        cost_points: 0
      - text: "Connect the tables through transactions.suspect_id and suspects.id, then keep amounts above the threshold."
        cost_points: 2
      - text: "Return the suspect name with amount and description, filter amount > 10000, and order the amounts from largest down."
        cost_points: 5
    npc_hints:
      - character: "blake"
        dialogue: "Numbers don't lie. One transaction is far too large for a charity gala; trace that record back to its suspect."
        xp_cost: 0
      - character: "maya"
        dialogue: "Use the foreign-key relationship to bring the suspect name beside each transaction. Apply the numeric threshold before sorting the result."
        xp_cost: 2
      - character: "riya"
        dialogue: "Money is in transactions and names are in suspects. Join them, keep only the unusually large payment, and report the requested three fields."
        xp_cost: 5

  - slug: "name-the-culprit"
    order: 3
    title: "Name the Culprit"
    prompt: |
      The evidence is clear. Write a query that returns the name and role of
      the suspect who made a transaction labelled 'Wire transfer out'.
      This is your arrest query — get it right.
    schema_description: |
      Table: suspects  (id, name, role, attended)
      Table: transactions  (id, suspect_id, amount, description, txn_time)
    schema_sql: |
      CREATE TABLE suspects (
        id       INTEGER PRIMARY KEY,
        name     TEXT NOT NULL,
        role     TEXT NOT NULL,
        attended INTEGER NOT NULL DEFAULT 0
      );
      CREATE TABLE transactions (
        id           INTEGER PRIMARY KEY,
        suspect_id   INTEGER REFERENCES suspects(id),
        amount       REAL NOT NULL,
        description  TEXT,
        txn_time     TEXT
      );
    seed_sql: |
      INSERT INTO suspects VALUES
        (1, 'Eleanor Voss',   'Art Dealer',  1),
        (2, 'Marcus Hale',    'Collector',   1),
        (3, 'Fiona Draper',   'Art Dealer',  1),
        (4, 'Gregory Nunn',   'Auctioneer',  0);
      INSERT INTO transactions VALUES
        (1,  1,  5200.00, 'Lot 12 purchase',      '2024-06-14 19:45:00'),
        (2,  2, 47000.00, 'Wire transfer out',     '2024-06-14 22:10:00'),
        (3,  3,  1800.00, 'Lot 7 purchase',        '2024-06-14 20:30:00'),
        (4,  2,   350.00, 'Catalogue subscription','2024-06-14 18:00:00'),
        (5,  1,  2100.00, 'Lot 5 purchase',        '2024-06-14 21:00:00');
    expected_result:
      - name: "Marcus Hale"
        role: "Collector"
    order_sensitive: false
    xp_reward: 15
    hints:
      - text: "The decisive label is stored on a transaction, so begin by relating that transaction to its suspect."
        cost_points: 0
      - text: "Match the description exactly, then use the linked suspects row for the name and role."
        cost_points: 2
      - text: "Join on suspect_id, filter description to the wire-transfer label, and project only the suspect name and role."
        cost_points: 5
    npc_hints:
      - character: "blake"
        dialogue: "This is it. The suspicious transaction label is your lead; follow its owner back to the suspects file."
        xp_cost: 0
      - character: "maya"
        dialogue: "The transaction description is an exact text predicate. Once that row is linked through suspect_id, the requested role is available beside the name."
        xp_cost: 2
      - character: "riya"
        dialogue: "Look for the exact wire-transfer wording, then let the relationship reveal which suspect made it."
        xp_cost: 5
